name: Build APK (debug)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Clé de signature fixe (secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > monmontage.jks
            printf "storeFile=monmontage.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "APK signé avec la clé fixe du dépôt."
          else
            echo "::warning::Aucune clé dans les secrets : la publication YouTube ne fonctionnera pas."
          fi
      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Vraies erreurs uniquement (lignes « e: » de Kotlin et bloc « What went wrong »).
            { grep -E "^e: " build.log; grep -A 15 "What went wrong" build.log; } | grep -v "^> Task" | head -40 > errors.txt
            # 1) Une seule annotation qui regroupe toutes les erreurs
            msg=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Erreurs de compilation::${msg}"
            # 2) Les mêmes lignes dans le résumé de l'exécution, faciles à copier
            { echo "### Erreurs de compilation"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Journal complet en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journal-compilation
          path: build.log
      - uses: actions/upload-artifact@v6
        with:
          name: MonMontage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
