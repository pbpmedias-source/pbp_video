name: Build APK (debug)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Clé de signature fixe (secrets du dépôt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > monmontage.jks
            printf "storeFile=monmontage.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "APK signé avec la clé fixe du dépôt."
          else
            echo "::warning::Aucune clé dans les secrets : la publication YouTube ne fonctionnera pas."
          fi
      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - name: Journal complet en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journal-compilation
          path: build.log
      - uses: actions/upload-artifact@v6
        with:
          name: MonMontage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
