      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            { grep -E "^e: " build.log; grep -A 15 "What went wrong" build.log; } | grep -v "^> Task" | head -40 > errors.txt
            msg=$(sed 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Erreurs de compilation::${msg}"
            { echo "### Erreurs de compilation"; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Compiler l'APK debug
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - name: Journal complet en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journal-compilation
          path: build.log
      - uses: actions/upload-artifact@v6
        with:
          name: MonMontage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
